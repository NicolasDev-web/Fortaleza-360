[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fortaleza-saude-360-data"
version = "0.1.0"
description = "Pipeline geoespacial reproduzível do Fortaleza Saúde 360°"
requires-python = ">=3.11,<3.14"
dependencies = [
  "geopandas==1.2.0",
  "pandas==3.1.0",
  "pmtiles==3.8.1",
  "shapely==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
